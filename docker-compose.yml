# docker compose up -d      (set ADMIN_PASSWORD and DATA_KEY in a .env file next to this one - never commit it)
services:
  mil-track:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AUTH: "1"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      DATA_KEY: ${DATA_KEY:?set DATA_KEY in .env}
      # TRUST_PROXY: "1"     # when a reverse proxy (HTTPS) sits in front
      # ACCESS_CODE: ""      # optional shared code before the login screen
    volumes:
      - mil-track-data:/data
volumes:
  mil-track-data:
